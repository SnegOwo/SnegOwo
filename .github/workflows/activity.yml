name: Refresh activity card

on:
  schedule:
    # Daily at 04:17 UTC, off the hour to dodge GitHub's busiest slots.
    - cron: "17 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: activity-card
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: pip install --quiet pillow

      # Needs a PAT with `repo` scope so private contributions are counted.
      # The default GITHUB_TOKEN only sees this repo and would report ~56, not 398.
      - name: Render card
        env:
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN }}
        run: python render_activity.py

      - name: Commit updated card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/activity-dark.png assets/activity-light.png
          if git diff --cached --quiet; then
            echo "Card unchanged, skipping commit."
          else
            git commit -m "chore: refresh activity card"
            git push
          fi
